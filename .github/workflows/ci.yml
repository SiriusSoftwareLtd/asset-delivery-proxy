name: CI

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  dedupe:
    name: Check existing CI
    runs-on: ubuntu-latest

    outputs:
      should-run: ${{ steps.decision.outputs.should-run }}

    steps:
      - name: Check for a successful run on this commit
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          successful_run="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty'
          )"

          if [ -n "$successful_run" ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "Commit ${HEAD_SHA} already passed CI in run ${successful_run}."
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint, Format, Typecheck and Test
    needs: dedupe
    if: needs.dedupe.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm lint

      - name: Run tests with coverage
        run: pnpm coverage
        env:
          ROBLOX_API_KEY: "ci-test-key"

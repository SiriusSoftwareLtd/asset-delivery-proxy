name: CD
permissions:
  contents: read
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  verify-current-main:
    name: Verify Current Main Head
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.stale_sha_guard.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          submodules: true

      - name: Guard Against Stale CI SHA
        id: stale_sha_guard
        run: |
          set -euo pipefail

          current_main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          echo "current_main_sha=${current_main_sha}" >> "${GITHUB_OUTPUT}"

          if [ "${CI_HEAD_SHA}" = "${current_main_sha}" ]; then
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
            echo "CI SHA ${CI_HEAD_SHA} is current main; deployment may continue."
          else
            echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
            echo "CI SHA ${CI_HEAD_SHA} is stale; current main is ${current_main_sha}. Skipping deployment."
          fi
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

  deploy:
    name: Deploy Worker
    needs: verify-current-main
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        needs.verify-current-main.outputs.should_deploy == 'true'
      }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          submodules: true

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.18.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm ci

      - name: Deploy Worker
        run: pnpm deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
